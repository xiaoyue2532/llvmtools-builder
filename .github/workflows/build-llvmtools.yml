name: build-llvmtools

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "llvm-project release to build (e.g. 18.1.8)"
        required: false
        default: "18.1.8"

permissions:
  contents: write

concurrency:
  group: build-llvmtools-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: ${{ github.event.inputs.llvm_version || '18.1.8' }}
  # 用 -O2 覆盖 Release，Docker/CI 上更稳，且和发行版打补丁后的行为一致。
  # 通过 CMAKE_*_FLAGS_RELEASE（非 INIT）覆盖，脚本里会带回 -DNDEBUG。
  OPT_FLAG: "-O2"
  INSTALL_PREFIX: ${{ github.workspace }}/out/llvmtools
  BUILD_DIR: ${{ github.workspace }}/build-llvm
  SRC_DIR: ${{ github.workspace }}/llvm-project
  # LINK_JOBS: "1"
  SOURCE_DATE_EPOCH: "1704067200"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2
        with:
          preinstalled-runtimes: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@v7

      - name: Install matching host LLVM + tools
        run: |
          LLVM_MAJOR="${LLVM_VERSION%%.*}"
          if [[ ! "$LLVM_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid LLVM_VERSION: $LLVM_VERSION"
            exit 1
          fi

          sudo apt update
          sudo apt install -y cmake mold ninja-build
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_MAJOR"

          LLVM_BINDIR="/usr/lib/llvm-${LLVM_MAJOR}/bin"
          echo "LLVM_BINDIR=$LLVM_BINDIR" >> "$GITHUB_ENV"
          "$LLVM_BINDIR/clang" --version
          "$LLVM_BINDIR/clang" --version | grep -Eq "clang version ${LLVM_MAJOR}\."

      - name: Build llvmtools
        run: bash scripts/build-llvmtools.sh

      - name: Package
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: llvmtools-${{ env.LLVM_VERSION }}
          path: |
            dist/*.tar.zst
            dist/SHA256SUMS
          retention-days: 3
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: llvmtools-${{ env.LLVM_VERSION }}
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/llvmtools-${{ env.LLVM_VERSION }}-x86_64-pc-linux-gnu.tar.zst
          generate_release_notes: true
